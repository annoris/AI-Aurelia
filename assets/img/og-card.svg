<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">Aurelia AI — Enterprise Intelligence &amp; Business Automation Platform</title>
  <desc id="og-desc">Document-grounded AI workspaces, visual agent flows, MCP tools, local CRM, and self-hosted enterprise automation.</desc>
  <defs>
